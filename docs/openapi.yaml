openapi: 3.1.0
info:
    title: API DHR — Centralisation des ouvrages hydrauliques ruraux
    version: 1.3.0
    description: |
        API de la Direction de l'Hydraulique Rurale (DHR) pour la centralisation
        des données sur les ouvrages hydrauliques ruraux.

        ## Authentification
        - **Lecture** : header `X-API-Key`
        - **Écriture** : header `Authorization: Bearer <jwt>`

        ## Format d'erreur
        Toutes les erreurs suivent RFC 7807 (Problem Details).

        ## Pagination
        - **Offset** pour les petites listes (`sources`, `ref-geo`, `fichiers`,
          `feuilles`, `runs`, `localites`)
        - **Cursor** pour les listes volumineuses (`lignes`, `ouvrages`)

        ## Métadonnées non mappées & Qualité d'eau
        Les entités `localite`, `ouvrage` et `cgpe` portent un champ `metadata`
        (jsonb) qui capture les attributs complémentaires. `ouvrage` porte également
        un champ `qualite_eau` (jsonb) pour les indicateurs sanitaires et physico-chimiques.
        Convention : `docs/metadata_conventions.md`.
        Le champ `metadata` est exclu par défaut des listes, et inclus via `?include=metadata`.

        ## Export
        Deux endpoints d'export tabulaire sont disponibles :
        - `GET /ouvrages/export` → fichier Excel (.xlsx) streamé (avec feuille Synthèse)
        - `GET /ouvrages/export.csv` → fichier CSV streamé

        Les filtres sont **identiques** à `GET /ouvrages`. Limite :
        `MAX_EXPORT_ROWS` (défaut 100 000), au-delà → 413.

        ## Mapping UI
        Deux endpoints permettent à l'UI de proposer et valider le mapping :
        - `GET /fichiers/{id}/mapping-proposal` → proposition auto
        - `PUT /fichiers/{id}/mapping` → sauvegarde du mapping validé

servers:
    - url: https://dhr.local
      description: Production
    - url: http://localhost:8000
      description: Développement local (les paths incluent le préfixe /v1)

tags:
    - name: Référentiels
      description: Sources, référentiel géo administratif et localités
    - name: Fichiers
      description: Fichiers ingérés, feuilles et mapping de colonnes
    - name: Ingestion
      description: Runs d'ingestion et lignes normalisées
    - name: Ouvrages
      description: Ouvrages consolidés, CGPE et exports
    - name: Carto
      description: Endpoints GeoJSON pour l'UI cartographique
    - name: Qualité
      description: Tableau de bord qualité d'ingestion

security:
    - ApiKeyAuth: []

paths:

    # ============================================================
    # RÉFÉRENTIELS
    # ============================================================

    /v1/sources:
        get:
            tags: [Référentiels]
            summary: Liste des sources
            parameters:
                - $ref: '#/components/parameters/Offset'
                - $ref: '#/components/parameters/Limit'
            responses:
                '200':
                    description: Liste paginée
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items: { $ref: '#/components/schemas/Source' }
                                    pagination: { $ref: '#/components/schemas/PaginationOffset' }
                '401': { $ref: '#/components/responses/Unauthorized' }

    /v1/ref-geo:
        get:
            tags: [Référentiels]
            summary: Nœuds du référentiel géographique administratif
            parameters:
                - name: niveau
                  in: query
                  schema:
                      type: string
                      enum: [district, region, departement, sous_prefecture, localite]
                - name: parent_id
                  in: query
                  schema: { type: integer }
                - $ref: '#/components/parameters/Offset'
                - $ref: '#/components/parameters/Limit'
            responses:
                '200':
                    description: Liste paginée
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items: { $ref: '#/components/schemas/RefGeoAdmin' }
                                    pagination: { $ref: '#/components/schemas/PaginationOffset' }
                '401': { $ref: '#/components/responses/Unauthorized' }

    /v1/ref-geo/{id}/chemin:
        get:
            tags: [Référentiels]
            summary: Chaîne hiérarchique district → localité
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer }
            responses:
                '200':
                    description: Chemin complet
                    content:
                        application/json:
                            schema:
                                type: array
                                items: { $ref: '#/components/schemas/RefGeoAdmin' }
                '404': { $ref: '#/components/responses/NotFound' }
                '401': { $ref: '#/components/responses/Unauthorized' }

    /v1/localites:
        get:
            tags: [Référentiels]
            summary: Liste des localités
            parameters:
                - name: id_geo
                  in: query
                  schema: { type: integer }
                - name: q
                  in: query
                  description: Recherche insensible aux accents sur le nom
                  schema: { type: string }
                - $ref: '#/components/parameters/Offset'
                - $ref: '#/components/parameters/Limit'
            responses:
                '200':
                    description: Liste paginée
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items: { $ref: '#/components/schemas/LocaliteResume' }
                                    pagination: { $ref: '#/components/schemas/PaginationOffset' }
                '401': { $ref: '#/components/responses/Unauthorized' }

    /v1/localites/{id}:
        get:
            tags: [Référentiels]
            summary: Détail d'une localité
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer }
                - name: include
                  in: query
                  description: Inclure metadata
                  schema:
                      type: string
                      enum: [metadata]
            responses:
                '200':
                    description: Localité
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Localite' }
                '404': { $ref: '#/components/responses/NotFound' }
                '401': { $ref: '#/components/responses/Unauthorized' }

    # ============================================================
    # FICHIERS
    # ============================================================

    /v1/fichiers:
        get:
            tags: [Fichiers]
            summary: Liste des fichiers
            parameters:
                - name: id_source
                  in: query
                  schema: { type: integer }
                - name: statut
                  in: query
                  schema:
                      type: string
                      enum: [en_attente, en_cours, ingere, partiel, erreur]
                - $ref: '#/components/parameters/Offset'
                - $ref: '#/components/parameters/Limit'
            responses:
                '200':
                    description: Liste paginée
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items: { $ref: '#/components/schemas/Fichier' }
                                    pagination: { $ref: '#/components/schemas/PaginationOffset' }
                '401': { $ref: '#/components/responses/Unauthorized' }

        post:
            tags: [Fichiers]
            summary: Uploader un fichier (synchrone)
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required: [file, id_source]
                            properties:
                                file:
                                    type: string
                                    format: binary
                                id_source:
                                    type: integer
                                commentaire:
                                    type: string
            parameters:
                - name: force
                  in: query
                  description: Forcer la réingestion si le hash SHA-256 existe déjà
                  schema: { type: boolean, default: false }
            responses:
                '201':
                    description: Fichier créé, feuilles analysées
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    id_fichier: { type: integer, format: int64 }
                                    nom_fichier_original: { type: string }
                                    statut: { type: string }
                                    hash_sha256: { type: string }
                                    est_reingestion: { type: boolean }
                                    feuilles_detectees:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                nom: { type: string }
                                                index: { type: integer }
                                                nb_lignes_estime: { type: integer }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '409': { $ref: '#/components/responses/Conflict' }

    /v1/fichiers/{id}:
        get:
            tags: [Fichiers]
            summary: Détail d'un fichier
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64 }
            responses:
                '200':
                    description: Fichier
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Fichier' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { $ref: '#/components/responses/NotFound' }

    /v1/fichiers/{id}/feuilles:
        get:
            tags: [Fichiers]
            summary: Feuilles d'un fichier
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64 }
                - $ref: '#/components/parameters/Offset'
                - $ref: '#/components/parameters/Limit'
            responses:
                '200':
                    description: Liste paginée
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items: { $ref: '#/components/schemas/Feuille' }
                                    pagination: { $ref: '#/components/schemas/PaginationOffset' }
                '401': { $ref: '#/components/responses/Unauthorized' }

    /v1/fichiers/{id}/mapping-proposal:
        get:
            tags: [Fichiers]
            summary: Proposition de mapping automatique
            description: |
                Retourne, pour chaque feuille du fichier, la liste des entêtes
                avec le champ cible proposé (mapping auto) et un score de confiance.
                Utilisé par l'UI de mapping pour afficher les conclusions du backend.
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64 }
            responses:
                '200':
                    description: Proposition de mapping
                    content:
                        application/json:
                            schema:
                                type: array
                                items: { $ref: '#/components/schemas/MappingProposalFeuille' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { $ref: '#/components/responses/NotFound' }

    /v1/fichiers/{id}/mapping:
        put:
            tags: [Fichiers]
            summary: Sauvegarde le mapping validé par l'utilisateur
            description: |
                Sauvegarde le mapping corrigé par l'utilisateur pour une feuille.
                L'ingestion et la consolidation utiliseront ce mapping en priorité.
            security:
                - BearerAuth: []
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64 }
                - name: id_feuille
                  in: query
                  description: Feuille cible (défaut : première feuille du fichier)
                  schema: { type: integer, format: int64 }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/MappingValidation' }
            responses:
                '200':
                    description: Mapping sauvegardé
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/MappingProposalFeuille' }
                '400': { $ref: '#/components/responses/BadRequest' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }

    # ============================================================
    # INGESTION
    # ============================================================

    /v1/fichiers/{id}/runs:
        get:
            tags: [Ingestion]
            summary: Historique des runs d'un fichier
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64 }
                - $ref: '#/components/parameters/Offset'
                - $ref: '#/components/parameters/Limit'
            responses:
                '200':
                    description: Liste paginée
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items: { $ref: '#/components/schemas/IngestionRun' }
                                    pagination: { $ref: '#/components/schemas/PaginationOffset' }
                '401': { $ref: '#/components/responses/Unauthorized' }

        post:
            tags: [Ingestion]
            summary: Lancer une ingestion (asynchrone)
            description: |
                Le pipeline complet (ingestion → rapprochement → consolidation) est
                exécuté en arrière-plan. Le client poll `GET /runs/{id}` pour suivre.
            security:
                - BearerAuth: []
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64 }
                - name: mode
                  in: query
                  schema:
                      type: string
                      enum: [complet, echantillon, plage]
                      default: complet
                - name: id_feuille
                  in: query
                  schema: { type: integer, format: int64 }
                - name: limite_lignes
                  in: query
                  schema: { type: integer, minimum: 1 }
                - name: ligne_debut
                  in: query
                  schema: { type: integer, minimum: 1 }
                - name: ligne_fin
                  in: query
                  schema: { type: integer, minimum: 1 }
            responses:
                '202':
                    description: Ingestion lancée
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    id_run: { type: integer, format: int64 }
                                    id_fichier: { type: integer, format: int64 }
                                    statut: { type: string, enum: [en_cours] }
                                    started_at: { type: string, format: date-time }
                                    poll_url: { type: string }
                '400': { $ref: '#/components/responses/BadRequest' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /v1/runs/{id}:
        get:
            tags: [Ingestion]
            summary: Suivi d'un run
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64 }
            responses:
                '200':
                    description: Run
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/IngestionRun' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { $ref: '#/components/responses/NotFound' }

    /v1/runs/{id}/lignes:
        get:
            tags: [Ingestion]
            summary: Lignes d'un run (cursor)
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64 }
                - name: statut_qualite
                  in: query
                  schema:
                      type: string
                      enum: [ok, localite_non_resolue, geom_invalide, type_ouvrage_inconnu, rejete, doublon_suspect]
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                '200':
                    description: Liste paginée
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items: { $ref: '#/components/schemas/LigneIngeree' }
                                    pagination: { $ref: '#/components/schemas/PaginationCursor' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { $ref: '#/components/responses/NotFound' }

    /v1/feuilles/{id}/lignes:
        get:
            tags: [Ingestion]
            summary: Lignes d'une feuille (cursor)
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64 }
                - name: id_run
                  in: query
                  schema: { type: integer, format: int64 }
                - name: statut_qualite
                  in: query
                  schema:
                      type: string
                      enum: [ok, localite_non_resolue, geom_invalide, type_ouvrage_inconnu, rejete, doublon_suspect]
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                '200':
                    description: Liste paginée
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items: { $ref: '#/components/schemas/LigneIngeree' }
                                    pagination: { $ref: '#/components/schemas/PaginationCursor' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { $ref: '#/components/responses/NotFound' }

    /v1/lignes/{id}:
        get:
            tags: [Ingestion]
            summary: Détail d'une ligne
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64 }
                - name: include
                  in: query
                  description: Inclure les données brutes
                  schema:
                      type: string
                      enum: [brut]
            responses:
                '200':
                    description: Ligne
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/LigneIngeree'
                                    - $ref: '#/components/schemas/LigneIngereeAvecBrut'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { $ref: '#/components/responses/NotFound' }

    # ============================================================
    # OUVRAGES & CGPE
    # ============================================================

    /v1/ouvrages:
        get:
            tags: [Ouvrages]
            summary: Liste des ouvrages consolidés (cursor)
            parameters:
                - $ref: '#/components/parameters/NatureOuvrage'
                - $ref: '#/components/parameters/TypeAlimentation'
                - $ref: '#/components/parameters/RealisationPar'
                - $ref: '#/components/parameters/Etat'
                - $ref: '#/components/parameters/Region'
                - $ref: '#/components/parameters/Departement'
                - $ref: '#/components/parameters/SousPrefecture'
                - $ref: '#/components/parameters/Localite'
                - $ref: '#/components/parameters/AnneeMin'
                - $ref: '#/components/parameters/AnneeMax'
                - $ref: '#/components/parameters/Bailleur'
                - name: include
                  in: query
                  description: Inclure metadata dans la liste (coûteux)
                  schema:
                      type: string
                      enum: [metadata]
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                '200':
                    description: Liste paginée
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items: { $ref: '#/components/schemas/Ouvrage' }
                                    pagination: { $ref: '#/components/schemas/PaginationCursor' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /v1/ouvrages/{id}:
        get:
            tags: [Ouvrages]
            summary: Détail d'un ouvrage
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64 }
                - name: include
                  in: query
                  description: Inclure metadata
                  schema:
                      type: string
                      enum: [metadata]
            responses:
                '200':
                    description: Ouvrage
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Ouvrage' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { $ref: '#/components/responses/NotFound' }

    /v1/ouvrages/export:
        get:
            tags: [Ouvrages]
            summary: Export Excel des ouvrages filtrés
            description: |
                Mêmes filtres que `GET /ouvrages`. Le fichier inclut une feuille
                Synthèse (KPI) par défaut, désactivable avec `?with_summary=false`.
            parameters:
                - $ref: '#/components/parameters/NatureOuvrage'
                - $ref: '#/components/parameters/TypeAlimentation'
                - $ref: '#/components/parameters/RealisationPar'
                - $ref: '#/components/parameters/Etat'
                - $ref: '#/components/parameters/Region'
                - $ref: '#/components/parameters/Departement'
                - $ref: '#/components/parameters/SousPrefecture'
                - $ref: '#/components/parameters/Localite'
                - $ref: '#/components/parameters/AnneeMin'
                - $ref: '#/components/parameters/AnneeMax'
                - $ref: '#/components/parameters/Bailleur'
                - name: include
                  in: query
                  schema:
                      type: string
                      enum: [metadata]
                - name: with_summary
                  in: query
                  description: Inclure la feuille Synthèse (KPI)
                  schema: { type: boolean, default: true }
            responses:
                '200':
                    description: Fichier Excel
                    content:
                        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
                            schema:
                                type: string
                                format: binary
                '401': { $ref: '#/components/responses/Unauthorized' }
                '413': { $ref: '#/components/responses/PayloadTooLarge' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /v1/ouvrages/export.csv:
        get:
            tags: [Ouvrages]
            summary: Export CSV des ouvrages filtrés
            description: |
                Mêmes filtres que `GET /ouvrages`. Séparateur `;`, encodage UTF-8.
            parameters:
                - $ref: '#/components/parameters/NatureOuvrage'
                - $ref: '#/components/parameters/TypeAlimentation'
                - $ref: '#/components/parameters/RealisationPar'
                - $ref: '#/components/parameters/Etat'
                - $ref: '#/components/parameters/Region'
                - $ref: '#/components/parameters/Departement'
                - $ref: '#/components/parameters/SousPrefecture'
                - $ref: '#/components/parameters/Localite'
                - $ref: '#/components/parameters/AnneeMin'
                - $ref: '#/components/parameters/AnneeMax'
                - $ref: '#/components/parameters/Bailleur'
                - name: include
                  in: query
                  schema:
                      type: string
                      enum: [metadata]
            responses:
                '200':
                    description: Fichier CSV
                    content:
                        text/csv:
                            schema:
                                type: string
                                format: binary
                '401': { $ref: '#/components/responses/Unauthorized' }
                '413': { $ref: '#/components/responses/PayloadTooLarge' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /v1/cgpe/{id}:
        get:
            tags: [Ouvrages]
            summary: Détail d'un CGPE
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64 }
                - name: include
                  in: query
                  schema:
                      type: string
                      enum: [metadata]
            responses:
                '200':
                    description: CGPE
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/CGPE' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { $ref: '#/components/responses/NotFound' }

    # ============================================================
    # CARTO
    # ============================================================

    /v1/carto/fichiers/{id_fichier}/points:
        get:
            tags: [Carto]
            summary: Points bruts d'un fichier (GeoJSON)
            parameters:
                - name: id_fichier
                  in: path
                  required: true
                  schema: { type: integer, format: int64 }
                - name: id_feuille
                  in: query
                  schema: { type: integer, format: int64 }
                - name: id_run
                  in: query
                  schema: { type: integer, format: int64 }
                - name: statut_qualite
                  in: query
                  schema:
                      type: string
                      enum: [ok, localite_non_resolue, geom_invalide, type_ouvrage_inconnu, rejete, doublon_suspect]
                - name: type_alimentation
                  in: query
                  schema:
                      type: string
                      enum: [PMH, HVA, PEA, HV, AUTRE]
                - name: localite
                  in: query
                  schema: { type: string }
                - name: region
                  in: query
                  schema: { type: string }
                - name: departement
                  in: query
                  schema: { type: string }
                - name: sous_prefecture
                  in: query
                  schema: { type: string }
            responses:
                '200':
                    description: FeatureCollection GeoJSON
                    content:
                        application/geo+json:
                            schema: { $ref: '#/components/schemas/FeatureCollectionPoints' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { $ref: '#/components/responses/NotFound' }

    /v1/carto/fichiers/{id_fichier}/points.geojson:
        get:
            tags: [Carto]
            summary: Téléchargement GeoJSON des points d'un fichier
            parameters:
                - name: id_fichier
                  in: path
                  required: true
                  schema: { type: integer, format: int64 }
                - name: id_feuille
                  in: query
                  schema: { type: integer, format: int64 }
                - name: id_run
                  in: query
                  schema: { type: integer, format: int64 }
                - name: statut_qualite
                  in: query
                  schema:
                      type: string
                      enum: [ok, localite_non_resolue, geom_invalide, type_ouvrage_inconnu, rejete, doublon_suspect]
                - name: type_alimentation
                  in: query
                  schema:
                      type: string
                      enum: [PMH, HVA, PEA, HV, AUTRE]
                - name: localite
                  in: query
                  schema: { type: string }
                - name: region
                  in: query
                  schema: { type: string }
                - name: departement
                  in: query
                  schema: { type: string }
                - name: sous_prefecture
                  in: query
                  schema: { type: string }
            responses:
                '200':
                    description: Fichier GeoJSON
                    content:
                        application/geo+json:
                            schema:
                                type: string
                                format: binary
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { $ref: '#/components/responses/NotFound' }

    /v1/carto/tous/points:
        get:
            tags: [Carto]
            summary: Tous les ouvrages consolidés (GeoJSON)
            parameters:
                - $ref: '#/components/parameters/NatureOuvrage'
                - $ref: '#/components/parameters/TypeAlimentation'
                - $ref: '#/components/parameters/RealisationPar'
                - $ref: '#/components/parameters/Etat'
                - $ref: '#/components/parameters/Region'
                - $ref: '#/components/parameters/Departement'
                - $ref: '#/components/parameters/SousPrefecture'
                - $ref: '#/components/parameters/Localite'
                - $ref: '#/components/parameters/AnneeMin'
                - $ref: '#/components/parameters/AnneeMax'
                - $ref: '#/components/parameters/Bailleur'
            responses:
                '200':
                    description: FeatureCollection GeoJSON
                    content:
                        application/geo+json:
                            schema: { $ref: '#/components/schemas/FeatureCollectionPoints' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '422': { $ref: '#/components/responses/ValidationError' }

    # ============================================================
    # QUALITÉ
    # ============================================================

    /v1/qualite/fichiers/{id}:
        get:
            tags: [Qualité]
            summary: Tableau de bord qualité d'un fichier
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64 }
            responses:
                '200':
                    description: Qualité du fichier
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/QualiteFichier' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { $ref: '#/components/responses/NotFound' }

components:

    securitySchemes:
        ApiKeyAuth:
            type: apiKey
            in: header
            name: X-API-Key
        BearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT

    parameters:
        Offset:
            name: offset
            in: query
            schema: { type: integer, minimum: 0, default: 0 }
        Limit:
            name: limit
            in: query
            schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        Cursor:
            name: cursor
            in: query
            description: Curseur opaque (base64)
            schema: { type: string }
        NatureOuvrage:
            name: nature_ouvrage
            in: query
            schema:
                type: string
                enum: [puits, forage, inconnu]
        TypeAlimentation:
            name: type_alimentation
            in: query
            schema:
                type: string
                enum: [PMH, HVA, PEA, HV, AUTRE]
        RealisationPar:
            name: realisation_par
            in: query
            schema:
                type: string
                enum: [public, prive, inconnu]
        Etat:
            name: etat
            in: query
            schema:
                type: string
                enum: [fonctionnel, en_panne, abandonne, inconnu]
        Region:
            name: region
            in: query
            schema: { type: string }
        Departement:
            name: departement
            in: query
            schema: { type: string }
        SousPrefecture:
            name: sous_prefecture
            in: query
            schema: { type: string }
        Localite:
            name: localite
            in: query
            description: Recherche insensible aux accents
            schema: { type: string }
        AnneeMin:
            name: annee_min
            in: query
            schema: { type: integer, minimum: 1900 }
        AnneeMax:
            name: annee_max
            in: query
            schema: { type: integer, minimum: 1900 }
        Bailleur:
            name: bailleur
            in: query
            description: Nom de la source financeuse
            schema: { type: string }

    responses:
        BadRequest:
            description: Requête invalide (RFC 7807)
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/Problem' }
        Unauthorized:
            description: API key ou JWT manquant/invalide (RFC 7807)
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/Problem' }
        Forbidden:
            description: Rôle JWT insuffisant (RFC 7807)
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/Problem' }
        NotFound:
            description: Ressource inexistante (RFC 7807)
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/Problem' }
        Conflict:
            description: Conflit métier (RFC 7807)
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/Problem' }
        PayloadTooLarge:
            description: Export trop volumineux (RFC 7807)
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/Problem' }
        ValidationError:
            description: Erreur de validation Pydantic (RFC 7807)
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/Problem' }

    schemas:

        # ----- RFC 7807 -----
        Problem:
            type: object
            required: [type, title, status]
            properties:
                type: { type: string, format: uri }
                title: { type: string }
                status: { type: integer }
                detail: { type: string, nullable: true }
                instance: { type: string, nullable: true }
                errors:
                    type: array
                    nullable: true
                    items:
                        type: object
                        properties:
                            field: { type: string }
                            message: { type: string }

        # ----- Pagination -----
        PaginationOffset:
            type: object
            required: [offset, limit]
            properties:
                offset: { type: integer }
                limit: { type: integer }
                total: { type: integer, nullable: true }

        PaginationCursor:
            type: object
            required: [limit, has_more]
            properties:
                limit: { type: integer }
                next_cursor: { type: string, nullable: true }
                has_more: { type: boolean }

        # ----- Référentiels -----
        Source:
            type: object
            required: [id_source, nom, type_source, actif]
            properties:
                id_source: { type: integer }
                nom: { type: string }
                type_source:
                    type: string
                    enum: [public, prive, bailleur, etat, autre]
                actif: { type: boolean }

        RefGeoParent:
            type: object
            properties:
                id_geo: { type: integer }
                niveau: { type: string }
                nom: { type: string }

        RefGeoAdmin:
            type: object
            required: [id_geo, niveau, nom]
            properties:
                id_geo: { type: integer }
                niveau:
                    type: string
                    enum: [district, region, departement, sous_prefecture, localite]
                nom: { type: string }
                code_officiel: { type: string, nullable: true }
                type_localite:
                    type: string
                    nullable: true
                    enum: [village, campement, autre, null]
                parent: { $ref: '#/components/schemas/RefGeoParent' }

        LocaliteResume:
            type: object
            required: [id_localite, nom_usage]
            properties:
                id_localite: { type: integer }
                nom_usage: { type: string }

        Localite:
            allOf:
                - $ref: '#/components/schemas/LocaliteResume'
                - type: object
                  properties:
                      latitude_centre: { type: number, nullable: true }
                      longitude_centre: { type: number, nullable: true }
                      geom_centre: { $ref: '#/components/schemas/GeoJSONPoint' }
                      alias:
                          type: array
                          items: { type: string }
                      metadata:
                          type: object
                          nullable: true
                          description: Présent uniquement si ?include=metadata

        # ----- Fichiers -----
        Fichier:
            type: object
            required: [id_fichier, nom_fichier_original, source, date_reception, statut]
            properties:
                id_fichier: { type: integer, format: int64 }
                nom_fichier_original: { type: string }
                source: { $ref: '#/components/schemas/Source' }
                hash_sha256: { type: string, nullable: true }
                taille_octets: { type: integer, format: int64, nullable: true }
                date_reception: { type: string, format: date-time }
                date_ingestion: { type: string, format: date-time, nullable: true }
                statut:
                    type: string
                    enum: [en_attente, en_cours, ingere, partiel, erreur]
                nb_feuilles: { type: integer }
                nb_lignes_total: { type: integer }
                est_reingestion: { type: boolean }
                commentaire: { type: string, nullable: true }

        Feuille:
            type: object
            required: [id_feuille, id_fichier, nom_feuille, index_feuille, type_contenu, statut_ingestion]
            properties:
                id_feuille: { type: integer, format: int64 }
                id_fichier: { type: integer, format: int64 }
                nom_feuille: { type: string }
                index_feuille: { type: integer }
                type_contenu:
                    type: string
                    enum: [ouvrages, cgpe, mixte, autre, inconnu]
                nb_lignes: { type: integer }
                nb_lignes_valides: { type: integer }
                statut_ingestion:
                    type: string
                    enum: [en_attente, en_cours, ingere, partiel, erreur]
                message_erreur: { type: string, nullable: true }

        # ----- Mapping -----
        MappingColonne:
            type: object
            required: [entete_brut, valide_par_utilisateur]
            properties:
                id_mapping: { type: integer, nullable: true }
                entete_brut: { type: string }
                champ_cible: { type: string, nullable: true }
                confiance: { type: number, nullable: true, minimum: 0, maximum: 1 }
                valide_par_utilisateur: { type: boolean }

        MappingProposalFeuille:
            type: object
            required: [id_feuille, nom_feuille, header_row, colonnes]
            properties:
                id_feuille: { type: integer, format: int64 }
                nom_feuille: { type: string }
                header_row: { type: integer }
                colonnes:
                    type: array
                    items: { $ref: '#/components/schemas/MappingColonne' }

        MappingValidationColonne:
            type: object
            required: [entete_brut]
            properties:
                entete_brut: { type: string }
                champ_cible: { type: string, nullable: true }

        MappingValidation:
            type: object
            required: [colonnes]
            properties:
                colonnes:
                    type: array
                    items: { $ref: '#/components/schemas/MappingValidationColonne' }

        # ----- Ingestion -----
        IngestionRun:
            type: object
            required: [id_run, id_fichier, mode, statut, started_at]
            properties:
                id_run: { type: integer, format: int64 }
                id_fichier: { type: integer, format: int64 }
                id_feuille: { type: integer, format: int64, nullable: true }
                mode:
                    type: string
                    enum: [complet, echantillon, plage]
                limite_lignes: { type: integer, nullable: true }
                ligne_debut: { type: integer, nullable: true }
                ligne_fin: { type: integer, nullable: true }
                nb_lignes_ingerees: { type: integer }
                statut:
                    type: string
                    enum: [en_cours, termine, erreur, annule]
                message: { type: string, nullable: true }
                started_at: { type: string, format: date-time }
                finished_at: { type: string, format: date-time, nullable: true }

        LigneIngeree:
            type: object
            required: [id_ligne, id_feuille, num_ligne_source, statut_qualite]
            properties:
                id_ligne: { type: integer, format: int64 }
                id_feuille: { type: integer, format: int64 }
                num_ligne_source: { type: integer }
                localite_brute: { type: string, nullable: true }
                type_ouvrage_brut: { type: string, nullable: true }
                usage_ouvrage_brut: { type: string, nullable: true }
                latitude_decimal: { type: number, nullable: true }
                longitude_decimal: { type: number, nullable: true }
                geom: { $ref: '#/components/schemas/GeoJSONPoint' }
                statut_qualite:
                    type: string
                    enum: [ok, localite_non_resolue, geom_invalide, type_ouvrage_inconnu, rejete, doublon_suspect]
                annee_projet: { type: integer, nullable: true }
                bailleur_brut: { type: string, nullable: true }

        LigneIngereeAvecBrut:
            allOf:
                - $ref: '#/components/schemas/LigneIngeree'
                - type: object
                  properties:
                      donnees_brutes:
                          type: object
                          additionalProperties: true

        # ----- Ouvrages -----
        CGPESummary:
            type: object
            properties:
                existe: { type: boolean }
                statut:
                    type: string
                    nullable: true
                    enum: [fonctionnel, non_fonctionnel, inconnu, null]

        FinancementResume:
            type: object
            properties:
                id_projet: { type: integer, format: int64 }
                nom_projet: { type: string }
                bailleur: { type: string, nullable: true }
                role:
                    type: string
                    enum: [principal, co_financement]

        Ouvrage:
            type: object
            required: [id_ouvrage, etat, localite]
            properties:
                id_ouvrage: { type: integer, format: int64 }
                code_ouvrage: { type: string, nullable: true }
                nature_ouvrage:
                    type: string
                    nullable: true
                    enum: [puits, forage, inconnu, null]
                type_alimentation:
                    type: string
                    nullable: true
                    enum: [PMH, HVA, PEA, HV, AUTRE, null]
                realisation_par:
                    type: string
                    nullable: true
                    enum: [public, prive, inconnu, null]
                etat:
                    type: string
                    enum: [fonctionnel, en_panne, abandonne, inconnu]
                annee_realisation: { type: integer, nullable: true }
                localite: { $ref: '#/components/schemas/LocaliteResume' }
                geom: { $ref: '#/components/schemas/GeoJSONPoint' }
                cgpe: { $ref: '#/components/schemas/CGPESummary' }
                financements:
                    type: array
                    items: { $ref: '#/components/schemas/FinancementResume' }
                metadata:
                    type: object
                    nullable: true
                    description: Présent uniquement si ?include=metadata
                qualite_eau:
                    type: object
                    nullable: true

        CGPE:
            type: object
            required: [id_cgpe, id_localite, existe]
            properties:
                id_cgpe: { type: integer }
                id_localite: { type: integer }
                id_ouvrage: { type: integer, format: int64, nullable: true }
                existe: { type: boolean }
                date_creation: { type: string, format: date, nullable: true }
                statut:
                    type: string
                    nullable: true
                    enum: [fonctionnel, non_fonctionnel, inconnu, null]
                nb_membres: { type: integer, nullable: true }
                commentaire: { type: string, nullable: true }
                metadata: { type: object, nullable: true }

        # ----- Qualité -----
        QualiteStats:
            type: object
            properties:
                ok: { type: integer, default: 0 }
                localite_non_resolue: { type: integer, default: 0 }
                geom_invalide: { type: integer, default: 0 }
                type_ouvrage_inconnu: { type: integer, default: 0 }
                rejete: { type: integer, default: 0 }
                doublon_suspect: { type: integer, default: 0 }

        QualiteFichier:
            type: object
            required: [id_fichier, nom_fichier, source, statut, nb_lignes_total, qualite, taux_reussite]
            properties:
                id_fichier: { type: integer, format: int64 }
                nom_fichier: { type: string }
                source: { type: string }
                statut: { type: string }
                nb_lignes_total: { type: integer }
                qualite: { $ref: '#/components/schemas/QualiteStats' }
                taux_reussite: { type: number, minimum: 0, maximum: 1 }

        # ----- GeoJSON -----
        GeoJSONPoint:
            type: object
            nullable: true
            required: [type, coordinates]
            properties:
                type:
                    type: string
                    enum: [Point]
                coordinates:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items: { type: number }
                    description: "[longitude, latitude] (RFC 7946)"

        GeoJSONFeature:
            type: object
            required: [type, geometry, properties]
            properties:
                type:
                    type: string
                    enum: [Feature]
                id: { type: string, nullable: true }
                geometry: { $ref: '#/components/schemas/GeoJSONPoint' }
                properties:
                    type: object
                    additionalProperties: true

        FeatureCollectionPoints:
            type: object
            required: [type, features]
            properties:
                type:
                    type: string
                    enum: [FeatureCollection]
                features:
                    type: array
                    items: { $ref: '#/components/schemas/GeoJSONFeature' }
                meta:
                    type: object
                    additionalProperties: true