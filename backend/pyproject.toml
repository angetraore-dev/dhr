[project]
name = "dhr-backend"
version = "1.0.0"
description = "Back-end FastAPI pour la centralisation des ouvrages hydrauliques ruraux (DHR)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "DHR" }]

dependencies = [
    # --- Web framework ---
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "python-multipart>=0.0.12",
    "orjson>=3.10,<3.11",                 # sérialisation JSON rapide (ORJSONResponse)

    # --- Base de données ---
    "sqlalchemy>=2.0.35,<2.1",
    "geoalchemy2>=0.16,<0.17",
    "psycopg[binary]>=3.2,<3.3",
    "alembic>=1.13,<1.14",

    # --- Validation / config ---
    "pydantic>=2.9,<2.10",
    "pydantic-settings>=2.6,<2.7",
    "python-dotenv>=1.0,<1.1",

    # --- Auth ---
    "python-jose[cryptography]>=3.3,<3.4",
    "passlib[bcrypt]>=1.7,<1.8",

    # --- Excel ---
    "openpyxl>=3.1,<3.2",
    "xlsxwriter>=3.2,<3.3",

    # --- Client HTTP (tests) ---
    "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
dev = [
    # --- Tests ---
    "pytest>=8.3,<8.4",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<5.1",
    # --- Qualité ---
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<1.14",
    "types-passlib",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# =====================================================================
# RUFF
# =====================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# =====================================================================
# PYTEST
# =====================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: tests lents (peuvent être skippés en CI rapide)",
    "integration: tests d'intégration (pipeline complet)",
]

# =====================================================================
# MYPY
# =====================================================================
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true